<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <radialGradient id="glow" cx="62%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#04060D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2440" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="gear">
      <circle r="34" fill="none" stroke="url(#brand)" stroke-width="4"/>
      <circle r="12" fill="none" stroke="#8B5CF6" stroke-width="3"/>
      <g stroke="#8B5CF6" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-46"/>
        <line x1="24" y1="-24" x2="32.5" y2="-32.5"/>
        <line x1="34" y1="0" x2="46" y2="0"/>
        <line x1="24" y1="24" x2="32.5" y2="32.5"/>
        <line x1="0" y1="34" x2="0" y2="46"/>
        <line x1="-24" y1="24" x2="-32.5" y2="32.5"/>
        <line x1="-34" y1="0" x2="-46" y2="0"/>
        <line x1="-24" y1="-24" x2="-32.5" y2="-32.5"/>
      </g>
    </g>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="900" fill="#04060D"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- órbitas decorativas -->
  <circle cx="880" cy="300" r="290" fill="none" stroke="#1C2440" stroke-width="1.5" stroke-dasharray="3 9"/>
  <circle cx="880" cy="300" r="200" fill="none" stroke="#1C2440" stroke-width="1" stroke-dasharray="2 7"/>

  <!-- ============ pipeline ============ -->
  <!-- tubería principal -->
  <path d="M 90 560 H 1110" stroke="#1C2440" stroke-width="14" stroke-linecap="round"/>
  <path d="M 90 560 H 1110" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round"/>
  <!-- pulsos de datos en la tubería -->
  <g fill="#22D3EE">
    <circle cx="210" cy="560" r="6"/>
    <circle cx="470" cy="560" r="6" opacity="0.8"/>
    <circle cx="730" cy="560" r="6" opacity="0.6"/>
    <circle cx="960" cy="560" r="6" opacity="0.9"/>
  </g>
  <g fill="#8B5CF6">
    <rect x="300" y="556" width="22" height="8" rx="4"/>
    <rect x="590" y="556" width="22" height="8" rx="4" opacity="0.8"/>
    <rect x="850" y="556" width="22" height="8" rx="4" opacity="0.7"/>
  </g>

  <!-- etapa 1: entrenar -->
  <g>
    <rect x="120" y="470" width="150" height="84" rx="14" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
    <rect x="120" y="470" width="150" height="84" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2"/>
    <text x="195" y="508" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="15" font-weight="bold">TRAIN</text>
    <text x="195" y="532" text-anchor="middle" fill="#8E9AB8" font-family="monospace" font-size="11">loss 0.21 ↓</text>
  </g>

  <!-- etapa 2: empaquetar -->
  <g>
    <rect x="350" y="470" width="150" height="84" rx="14" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
    <rect x="350" y="470" width="150" height="84" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2"/>
    <text x="425" y="508" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="15" font-weight="bold">ONNX</text>
    <text x="425" y="532" text-anchor="middle" fill="#8E9AB8" font-family="monospace" font-size="11">int8 · 4×</text>
  </g>

  <!-- etapa 3: servir -->
  <g>
    <rect x="580" y="470" width="150" height="84" rx="14" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
    <rect x="580" y="470" width="150" height="84" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2"/>
    <text x="655" y="508" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="15" font-weight="bold">SERVE</text>
    <text x="655" y="532" text-anchor="middle" fill="#8E9AB8" font-family="monospace" font-size="11">P99 42 ms</text>
  </g>

  <!-- etapa 4: monitor (pantalla grande) -->
  <g>
    <rect x="800" y="150" width="320" height="240" rx="16" fill="url(#screen)" stroke="#1C2440" stroke-width="2"/>
    <rect x="800" y="150" width="320" height="240" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2"/>
    <!-- barra de título -->
    <circle cx="822" cy="172" r="4" fill="#FB7185"/>
    <circle cx="838" cy="172" r="4" fill="#FBBF24"/>
    <circle cx="854" cy="172" r="4" fill="#A3E635"/>
    <text x="1098" y="176" text-anchor="end" fill="#55618A" font-family="monospace" font-size="11">monitor.py</text>
    <!-- curva PSI -->
    <polyline points="820,330 860,326 900,328 940,318 980,300 1020,262 1060,220 1096,196"
      fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- umbral drift -->
    <line x1="820" y1="230" x2="1096" y2="230" stroke="#FB7185" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1092" y="222" text-anchor="end" fill="#FB7185" font-family="monospace" font-size="10">PSI = 0.2</text>
    <!-- punto de alerta -->
    <circle cx="1060" cy="220" r="6" fill="#FB7185"/>
    <circle cx="1060" cy="220" r="12" fill="none" stroke="#FB7185" stroke-opacity="0.5" stroke-width="2"/>
    <text x="824" y="212" fill="#8E9AB8" font-family="monospace" font-size="10">drift →</text>
    <!-- base del monitor -->
    <rect x="940" y="390" width="40" height="26" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
    <rect x="890" y="416" width="140" height="10" rx="5" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
  </g>

  <!-- cable monitor → etapa 4 -->
  <path d="M 960 426 V 470" stroke="#1C2440" stroke-width="4"/>
  <rect x="810" y="470" width="150" height="84" rx="14" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
  <rect x="810" y="470" width="150" height="84" rx="14" fill="none" stroke="#A3E635" stroke-opacity="0.45" stroke-width="2"/>
  <text x="885" y="508" text-anchor="middle" fill="#A3E635" font-family="monospace" font-size="15" font-weight="bold">RETRAIN</text>
  <text x="885" y="532" text-anchor="middle" fill="#8E9AB8" font-family="monospace" font-size="11">trigger: PSI≥0.2</text>

  <!-- lazo de feedback retrain → train -->
  <path d="M 810 512 H 60 V 512 H 90" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.7"/>
  <path d="M 96 506 L 84 512 L 96 518" fill="none" stroke="#A3E635" stroke-width="2.5" stroke-opacity="0.7"/>
  <text x="440" y="500" text-anchor="middle" fill="#A3E635" font-family="monospace" font-size="11" opacity="0.85">feedback loop</text>

  <!-- engranajes -->
  <g transform="translate(195,630) scale(0.9)"><use href="#gear"/></g>
  <g transform="translate(268,664) scale(0.55)" opacity="0.8"><use href="#gear"/></g>
  <g transform="translate(655,648) scale(0.75)" opacity="0.9"><use href="#gear"/></g>

  <!-- mini panel de percentiles -->
  <g>
    <rect x="120" y="150" width="250" height="170" rx="14" fill="#0D1322" stroke="#1C2440" stroke-width="2"/>
    <text x="140" y="178" fill="#55618A" font-family="monospace" font-size="11">latencia (ms)</text>
    <g font-family="monospace" font-size="12">
      <text x="140" y="212" fill="#22D3EE">P50</text>
      <rect x="190" y="202" width="60" height="10" rx="5" fill="#22D3EE" opacity="0.8"/>
      <text x="140" y="246" fill="#FBBF24">P95</text>
      <rect x="190" y="236" width="110" height="10" rx="5" fill="#FBBF24" opacity="0.8"/>
      <text x="140" y="280" fill="#FB7185">P99</text>
      <rect x="190" y="270" width="160" height="10" rx="5" fill="#FB7185" opacity="0.85"/>
    </g>
  </g>

  <!-- chips flotantes -->
  <g font-family="monospace" font-size="12">
    <rect x="430" y="180" width="104" height="34" rx="17" fill="#0D1322" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <text x="482" y="202" text-anchor="middle" fill="#8B5CF6">int8 −75%</text>
    <rect x="560" y="240" width="96" height="34" rx="17" fill="#0D1322" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="608" y="262" text-anchor="middle" fill="#22D3EE">SLA 99.9%</text>
    <rect x="430" y="300" width="88" height="34" rx="17" fill="#0D1322" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="474" y="322" text-anchor="middle" fill="#FBBF24">v2.3.1</text>
  </g>

  <!-- partículas ambientales -->
  <g fill="#22D3EE">
    <circle cx="150" cy="90" r="2.5" opacity="0.7"/>
    <circle cx="700" cy="120" r="2" opacity="0.5"/>
    <circle cx="1120" cy="500" r="2.5" opacity="0.6"/>
    <circle cx="380" cy="700" r="2" opacity="0.5"/>
    <circle cx="1040" cy="700" r="2.5" opacity="0.5"/>
  </g>
  <g fill="#8B5CF6">
    <circle cx="540" cy="80" r="3" opacity="0.6"/>
    <circle cx="80" cy="380" r="2.5" opacity="0.5"/>
    <circle cx="760" cy="760" r="2.5" opacity="0.6"/>
    <circle cx="1140" cy="820" r="2" opacity="0.4"/>
  </g>

  <!-- resplandor central suave -->
  <circle cx="880" cy="300" r="180" fill="#8B5CF6" opacity="0.06" filter="url(#soft)"/>
</svg>
