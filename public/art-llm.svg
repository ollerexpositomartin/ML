      <path d="M 0 -44 A 44 44 0 1 1 -31 31" stroke="#22D3EE" stroke-width="1.3" opacity="0.4"/>
    </g>
    <!-- marcas de ángulo (posiciones) -->
    <g stroke="#55618A" stroke-width="1.4" opacity="0.7">
      <line x1="0" y1="-260" x2="0" y2="-286"/>
      <line x1="184" y1="-184" x2="202" y2="-202"/>
      <line x1="260" y1="0" x2="286" y2="0"/>
      <line x1="184" y1="184" x2="202" y2="202"/>
      <line x1="-184" y1="-184" x2="-202" y2="-202"/>
      <line x1="-260" y1="0" x2="-286" y2="0"/>
    </g>
    <!-- vector rotado -->
    <line x1="0" y1="0" x2="150" y2="-150" stroke="#FB7185" stroke-width="3.4"/>
    <circle cx="150" cy="-150" r="7" fill="#FB7185"/>
    <circle cx="150" cy="-150" r="14" fill="none" stroke="#FB7185" opacity="0.4"/>
    <line x1="0" y1="0" x2="212" y2="0" stroke="#55618A" stroke-width="1.6" stroke-dasharray="5 6"/>
    <path d="M 92 0 A 92 92 0 0 0 65 -65" stroke="#FBBF24" stroke-width="2.2"/>
    <text x="104" y="-30" fill="#FBBF24" font-family="monospace" font-size="22">θ·m</text>
    <circle cx="0" cy="0" r="10" fill="#0D1322" stroke="url(#brand)" stroke-width="3"/>
  </g>

