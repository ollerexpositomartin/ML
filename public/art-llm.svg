<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <radialGradient id="glow-center" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04060D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1C2440" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="900" fill="#04060D"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#glow-center)"/>

  <!-- ondas RoPE: espirales de rotación concéntricas -->
  <g transform="translate(600,390)" fill="none" stroke-linecap="round">
